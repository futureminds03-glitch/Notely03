name: Notely MCP CI

on:
  push:
    branches: [feat/notely-mcp-server]
    paths:
      - 'app/api/mcp/**'
      - 'app/api/oauth/**'
      - 'app/.well-known/**'
      - 'lib/mcp/**'
      - 'tests/mcp/**'
      - 'tests/e2e/notely-mcp.spec.js'
      - 'docs/mcp.md'
      - 'supabase/migrations/*mcp*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/notely-mcp-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/api/mcp/**'
      - 'app/api/oauth/**'
      - 'app/.well-known/**'
      - 'lib/mcp/**'
      - 'tests/mcp/**'
      - 'tests/e2e/notely-mcp.spec.js'
      - 'docs/mcp.md'
      - 'supabase/migrations/*mcp*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/notely-mcp-ci.yml'

permissions:
  contents: read

concurrency:
  group: notely-mcp-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
