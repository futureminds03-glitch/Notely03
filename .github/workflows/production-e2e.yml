name: Notely E2E regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'proxy.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - '.github/workflows/production-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'proxy.ts'
      - 'tests/e2e/**'
      - 'supabase/migrations/**'
      - 'docs/MEMORY_ENGINE.md'
      - 'README.md'
      - 'vercel.json'
      - '.github/workflows/production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notely-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application and Playwright dependencies
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build application
        run: npm run build
      - name: Start local production server
        run: nohup npm run start > /tmp/notely.log 2>&1 &
      - name: Wait for local server
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notely.log
          exit 1
      - name: Run end-to-end regression suite
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e --reporter=list
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notely-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore

  production-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow production deployment to settle
        run: sleep 45
      - name: Run production end-to-end regression suite
        env:
          E2E_BASE_URL: https://notely03.vercel.app
        run: npx playwright test tests/e2e --reporter=list
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notely-production-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
